<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle with gradient -->
  <circle cx="512" cy="512" r="480" fill="url(#gradient)"/>
  
  <!-- Main icon - stylized fork and knife -->
  <g transform="translate(512, 512)">
    <!-- Fork -->
    <rect x="-80" y="-200" width="12" height="300" fill="#ffffff" rx="6"/>
    <rect x="-100" y="-200" width="12" height="300" fill="#ffffff" rx="6"/>
    <rect x="-60" y="-200" width="12" height="300" fill="#ffffff" rx="6"/>
    <rect x="-40" y="-200" width="12" height="300" fill="#ffffff" rx="6"/>
    
    <!-- Knife -->
    <rect x="40" y="-200" width="8" height="300" fill="#ffffff" rx="4"/>
    <path d="M 40 -200 L 80 -180 L 40 -160 Z" fill="#ffffff"/>
    
    <!-- Plate/Circle in center -->
    <circle cx="0" cy="0" r="120" fill="none" stroke="#ffffff" stroke-width="8"/>
    
    <!-- Food elements -->
    <circle cx="-40" cy="-20" r="8" fill="#ffffff"/>
    <circle cx="20" cy="10" r="6" fill="#ffffff"/>
    <circle cx="0" cy="30" r="7" fill="#ffffff"/>
    <circle cx="-20" cy="40" r="5" fill="#ffffff"/>
  </g>
</svg>
